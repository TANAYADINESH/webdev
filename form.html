<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>HTML forms</h1>
    <p> THis form collects basic data </p>
    <form action="">
        <h1>Basic Information</h1>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password"><br><br>
        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password"><br><br>   

        <label for="male">Male</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="female">Female</label>
        <input type="radio" id="female" name="gender" value="female">
    
        <!-- Checkbox Buttons-->
         <h1>checkbox buttons</h1>
         <label for="subscribe">Subscribe to newsletter:</label>
         <input type="checkbox" id="subscribe" name="subscribe" value="subscribe">  
         <label for="terms">I agree to the terms and conditions</label>
         <input type="checkbox" id="terms" name="terms" value="terms">
         <h1>Multiple checkbox buttons</h1>
         <p>Select your preferred options:</p>  
         <label for="option1">Option 1</label>
         <input type="checkbox" id="option1" name="option1" value="  option1">
            <label for="option2">Option 2</label>
            <input type="checkbox" id="option2" name="option2" value="option2">
            <label for="option3">Option 3</label>
            <input type="checkbox" id="option3" name="option3" value="option3">
            
        <h1>Dropdown Menu</h1>
        <label for="dropdown">Choose an option:</label>
        <select id="country" name="country">
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="Italy">Italy</option>  
        </select>
        <br><br>
        <h1>long text area</h1>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="50" placeholder="Enter your message here"></textarea><br><br>
        <button type="reset">Reset</button>
        <button type="submit">Submit</button>
        <br><br>
        <h1>Submit button</h1>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
